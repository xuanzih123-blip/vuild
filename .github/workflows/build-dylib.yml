name: build-dylib

# Builds the TIZAntiCheat iOS dylib. The iOS SDK only exists on Apple hosts,
# so the job runs on a macOS runner; the committed hook table is used, the
# 54 MB global-metadata.dat is not needed in the repo.

on:
  push:
    branches: [main, master]
    paths:
      - "anticheat/**"
      - ".github/workflows/build-dylib.yml"
  pull_request:
    paths:
      - "anticheat/**"
  workflow_dispatch:
    inputs:
      toolchain:
        description: "build path"
        default: "xcrun"
        type: choice
        options: [xcrun, theos]

env:
  TOOLCHAIN: ${{ github.event.inputs.toolchain || 'xcrun' }}

jobs:
  host-check:
    name: host check (portable core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python3 -m pip install --upgrade pyyaml
          sudo apt-get update
          sudo apt-get install -y cmake g++
      - name: Check that build.yml still matches source/
        run: python3 anticheat/tools/inline_sources.py --check
      - name: Compile and run the portable core test
        run: |
          cmake -S anticheat/tools/syntax_check -B anticheat/build/hostcheck
          cmake --build anticheat/build/hostcheck --config Release
          anticheat/build/hostcheck/tiz_anticheat_check \
            anticheat/source/anticheat_hooks.json

  dylib:
    name: dylib (macos, ${{ github.event.inputs.toolchain || 'xcrun' }})
    needs: host-check
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python3 -m pip install --upgrade pyyaml
          brew install ldid

      - name: Cache Theos
        if: env.TOOLCHAIN == 'theos'
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-${{ runner.os }}-${{ runner.arch }}

      - name: Install Theos
        if: env.TOOLCHAIN == 'theos'
        run: |
          export THEOS="$HOME/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          if [ ! -d "$THEOS" ]; then
            bash -c "$(curl -fsSL https://theos.com/installer.sh)"
          fi
          "$THEOS/bin/install-theos" "$THEOS" || true

      - name: Materialise the sources out of build.yml
        working-directory: anticheat
        run: python3 build.py --only materialise

      - name: Compile the dylib
        working-directory: anticheat
        run: python3 build.py --only compile --toolchain "$TOOLCHAIN"

      - name: Sign and inspect the dylib
        working-directory: anticheat
        continue-on-error: true
        run: |
          set -x
          # ldid takes the entitlements glued to the -S flag:
          #   ldid -Sentitlements.plist <macho>
          # A bare -S signs ad hoc, without any entitlements.
          ldid -Sresources/entitlements.plist build/TIZAntiCheat.dylib || \
          ldid -S build/TIZAntiCheat.dylib || true
          ldid -e build/TIZAntiCheat.dylib || true
          lipo -info build/TIZAntiCheat.dylib
          file build/TIZAntiCheat.dylib
          ls -l build/TIZAntiCheat.dylib
          otool -l build/TIZAntiCheat.dylib | grep -A3 LC_CODE_SIGNATURE || true

      - name: Smoke test the dylib
        working-directory: anticheat
        run: |
          set -x
          ls -l build/TIZAntiCheat.dylib
          python3 - <<'PY'
          import subprocess, sys
          path = "build/TIZAntiCheat.dylib"
          blob = open(path, "rb").read()
          out = subprocess.run(["otool", "-l", path], capture_output=True,
                               text=True).stdout
          lines = out.splitlines()
          text_size = 0
          for i, line in enumerate(lines):
              if line.strip() == "sectname __text":
                  for j in range(i, min(i + 12, len(lines))):
                      if lines[j].strip().startswith("size "):
                          text_size = int(lines[j].split()[1], 16)
                          break
                  break
          print("file size  : %d bytes" % len(blob))
          print("__text size: 0x%x (%d bytes)" % (text_size, text_size))
          missing = []
          for needle in (b"[TIZAntiCheat]", b"GameFacade", b"LogReportCheat"):
              ok = needle in blob
              print("  %-16s %s" % (needle.decode(), "found" if ok else "MISSING"))
              if not ok:
                  missing.append(needle.decode())
          # the entitlements are optional for loading, so this only warns
          if b"platform-application" in blob:
              print("  entitlements    present")
          else:
              print("  entitlements    MISSING (ad hoc signature, still loadable)")
          if text_size < 4096:
              print("FAIL: the dylib carries no code")
              sys.exit(1)
          if missing:
              print("FAIL: missing %s" % ", ".join(missing))
              sys.exit(1)
          print("SMOKE OK")
          PY
          nm -gU build/TIZAntiCheat.dylib | head -20 || true

      - name: Stage the install bundle
        working-directory: anticheat
        run: |
          mkdir -p build/install
          cp build/TIZAntiCheat.dylib build/install/
          cp resources/TIZAntiCheat.plist build/install/
          ls -l build/install

      - name: Upload the install bundle
        uses: actions/upload-artifact@v4
        with:
          name: TIZAntiCheat-install
          path: anticheat/build/install
          if-no-files-found: error

      - name: Upload the dylib
        uses: actions/upload-artifact@v4
        with:
          name: TIZAntiCheat-dylib
          path: anticheat/build/TIZAntiCheat.dylib
          if-no-files-found: error

      - name: Upload the hook table and the entitlements
        uses: actions/upload-artifact@v4
        with:
          name: TIZAntiCheat-hooks
          path: |
            anticheat/source/anticheat_hooks.json
            anticheat/resources/entitlements.plist
