# build.yml - the whole TIZAntiCheat module in one file.
#
# Everything the build needs is here: the target description, the toolchain
# flags, the IL2CPP runtime profile, the policy, the signing and install
# layout, and the sources themselves as literal blocks at the bottom.
#
#   python build.py            generate -> materialise -> compile -> sign -> package
#   python build.py --dry-run  print the commands, run nothing
#
# The sources are also checked out under source/ for editing; keep the two in
# sync with:  python tools/inline_sources.py

project:
  name: TIZAntiCheat
  version: 1.0.0
  description: >-
    Runtime hook layer that neutralises the Free Fire client-side anti-cheat
    entry points (emulator check, FF AntiHack gate, cheat reporting, memory
    check interval). Hook targets are resolved by managed class/method name at
    runtime, so the module survives game updates that only renumber tokens.

target:
  kind: dylib
  platform: ios
  arch: [arm64]
  min_ios: "13.0"
  output: TIZAntiCheat.dylib
  install_dir: /Library/MobileSubstrate/DynamicLibraries/

toolchain:
  kind: theos
  makefile: Makefile
  cxxflags: ["-fobjc-arc", "-fblocks", "-O2"]
  ldflags: ["-Wl,-install_name,TIZAntiCheat", "-Wl,-dead_strip"]
  theos_var: THEOS

dependencies:
  - id: substrate
    kind: optional
    probe: /Library/Frameworks/CydiaSubstrate.framework/CydiaSubstrate
    probe_alt: /Library/Frameworks/ElleKit.framework/ElleKit
  - id: fishhook
    kind: optional
    probe: /Library/MobileSubstrate/DynamicLibraries/fishhook.dylib

data:
  hooks_json: source/anticheat_hooks.json
  hooks_embedded_header: source/anticheat_hooks_embedded.h
  generator: tools/gen_hooks.py
  generator_inputs:
    metadata: ../global-metadata.dat

# IL2CPP internals. Offsets differ between Unity versions, so they live in the
# spec and can be re-pointed without touching code.
il2cpp:
  method_info:
    method_pointer_offset: 0x0
    name_offset: 0x10
    klass_offset: 0x18
    token_offset: 0x30
  class_info:
    static_fields_offset: 0xb8
    name_offset: 0x10
    namespace_offset: 0x18
  field_info:
    offset_offset: 0x0
    name_offset: 0x8
  api:
    class_from_name: il2cpp_class_from_name
    class_get_method_from_name: il2cpp_class_get_method_from_name
    class_get_field_from_name: il2cpp_class_get_field_from_name
    field_static_offset: il2cpp_field_static_get_value
    runtime_invoke: il2cpp_runtime_invoke

policy:
  default_action: block
  actions: [return_false, return_true, skip, set_static_int, set_static_string]
  log_level: info
  override_path: /var/mobile/Library/TIZAntiCheat/hooks.json

sign:
  adhoc: ldid -S
  entitlements: resources/entitlements.plist

install:
  dir: /Library/MobileSubstrate/DynamicLibraries/
  out: TIZAntiCheat.dylib

steps:
  - name: generate
    cmd: python tools/gen_hooks.py
  - name: materialise
    cmd: python build.py --only materialise
  - name: compile
    cmd: python build.py --only compile
  - name: sign
    cmd: python build.py --only sign
  - name: package
    cmd: python build.py --only package

# ---------------------------------------------------------------------------
# Sources. build.py writes them into build/src and compiles from there, so a
# clean checkout needs nothing but this file.
# ---------------------------------------------------------------------------
sources_inline:
  source/main.mm: |
    // main.mm - entry point of the TIZAntiCheat dylib.
    //
    // The library is loaded into the game process. It waits for the IL2CPP
    // runtime to come up, then installs the detours described by the generated
    // hook table (embedded in the binary, so no file dependency at runtime).
    #import <Foundation/Foundation.h>
    #include <dispatch/dispatch.h>
    #include <dlfcn.h>
    #include <mach-o/dyld.h>
    #include <mach-o/loader.h>
    #include <pthread.h>
    #include <string.h>
    #include <unistd.h>

    #include <string>
    #include <vector>

    #include "HookTable.h"
    #include "Il2CppResolver.h"
    #include "TIZAntiCheat.h"

    #include "anticheat_hooks_embedded.h"

    namespace tiz {

    InstallReport installHooks(const HookTable& table, Il2CppResolver& resolver);

    namespace {

    const char* kGameImageHints[] = {"UnityFramework", "libil2cpp", "il2cpp",
                                     "GameAssembly", "main"};

    // Walks the load commands to get the real mapped size of the image, so the
    // pattern scanner never reads past the end of the mapping.
    size_t ImageMappedSize(const struct mach_header* header) {
      size_t highest = 0;
      const uint8_t* cmd = reinterpret_cast<const uint8_t*>(header) +
                           sizeof(struct mach_header);
      for (uint32_t i = 0; i < header->ncmds; ++i) {
        const struct load_command* lc =
            reinterpret_cast<const struct load_command*>(cmd);
        if (lc->cmdsize == 0) break;
        if (lc->cmd == LC_SEGMENT_64) {
          const struct segment_command_64* seg =
              reinterpret_cast<const struct segment_command_64*>(lc);
          uintptr_t start = static_cast<uintptr_t>(seg->vmaddr) -
                            reinterpret_cast<uintptr_t>(header);
          uintptr_t end = start + seg->vmsize;
          if (end > highest) highest = end;
        }
        cmd += lc->cmdsize;
      }
      return highest;
    }

    void* FindGameImage(size_t* size_out, std::string* name_out) {
      uint32_t count = _dyld_image_count();
      for (uint32_t i = 0; i < count; ++i) {
        const char* raw = _dyld_get_image_name(i);
        if (!raw) continue;
        std::string name(raw);
        for (const char* hint : kGameImageHints) {
          if (name.find(hint) != std::string::npos) {
            const struct mach_header* header = _dyld_get_image_header(i);
            if (!header) continue;
            size_t size = ImageMappedSize(header);
            if (size == 0) continue;
            *size_out = size;
            *name_out = name;
            return const_cast<void*>(static_cast<const void*>(header));
          }
        }
      }
      return nullptr;
    }

    void* LoadHookTable(std::string* error) {
      HookTable table;
      if (!table.loadFromString(kAnticheatHooksJson, error)) return nullptr;
      // An on-disk table wins, so the behaviour can be changed without a rebuild.
      const char* override_path = "/var/mobile/Library/TIZAntiCheat/hooks.json";
      std::string file_error;
      HookTable file_table;
      if (file_table.loadFromFile(override_path, &file_error) &&
          !file_table.entries().empty()) {
        NSLog(@"[TIZAntiCheat] using hook table override %s",
              override_path);
        return new HookTable(file_table);
      }
      return new HookTable(table);
    }

    void* InstallThread(void* unused) {
      (void)unused;
      for (int attempt = 0; attempt < 120; ++attempt) {
        size_t size = 0;
        std::string name;
        void* base = FindGameImage(&size, &name);
        if (base) {
          std::string error;
          HookTable* table = static_cast<HookTable*>(LoadHookTable(&error));
          if (!table) {
            NSLog(@"[TIZAntiCheat] hook table rejected: %s", error.c_str());
            return nullptr;
          }
          Il2CppResolver resolver(table->profile());
          resolver.setGameImage(base, size, name);
          if (resolver.bindExportedApi(base)) {
            NSLog(@"[TIZAntiCheat] il2cpp API bound from %s", name.c_str());
          } else {
            NSLog(@"[TIZAntiCheat] no exported il2cpp API in %s, pattern mode only",
                  name.c_str());
          }
          resolver.bindStringApi(base);
          InstallReport report = installHooks(*table, resolver);
          NSLog(@"[TIZAntiCheat] installed %d, skipped %d, failed %d",
                report.installed, report.skipped, report.failed);
          delete table;
          return nullptr;
        }
        usleep(500 * 1000);
      }
      NSLog(@"[TIZAntiCheat] game image never appeared, giving up");
      return nullptr;
    }

    __attribute__((constructor)) static void TIZAntiCheatBootstrap() {
      pthread_t thread;
      if (pthread_create(&thread, nullptr, InstallThread, nullptr) == 0) {
        pthread_detach(thread);
      } else {
        NSLog(@"[TIZAntiCheat] could not start the install thread");
      }
    }

    }  // namespace
    }  // namespace tiz

  source/Hooks.mm: |
    // Hooks.mm - installs the neutralisation detours.
    //
    // Preferred mechanism: rewrite Il2CppMethodInfo::methodPointer so the game
    // calls our detour. That needs no Substrate and is atomic.
    //
    // Fallback (pattern scanned addresses only): MSHookFunction from Substrate or
    // ElleKit, when the device has it.
    #import <Foundation/Foundation.h>

    #include <cstdint>
    #include <cstring>
    #include <string>
    #include <vector>

    #include "HookTable.h"
    #include "Il2CppResolver.h"

    extern "C" void MSHookFunction(void* symbol, void* replacement, void** result)
        __attribute__((weak));

    namespace tiz {
    namespace {

    // The detours ignore the original arguments on purpose: they replace the
    // call, so the argument registers are simply not consumed.
    bool DetourReturnFalse(void* self) {
      (void)self;
      return false;
    }

    bool DetourReturnTrue(void* self) {
      (void)self;
      return true;
    }

    void DetourSkip(void* self) {
      (void)self;
    }

    void* DetourFor(HookAction action) {
      switch (action) {
        case HookAction::ReturnFalse: return reinterpret_cast<void*>(&DetourReturnFalse);
        case HookAction::ReturnTrue: return reinterpret_cast<void*>(&DetourReturnTrue);
        case HookAction::Skip: return reinterpret_cast<void*>(&DetourSkip);
        default: return nullptr;
      }
    }

    int ArgCountFor(const HookEntry& e) {
      // 0 means "unknown": the resolver then tries the overload list.
      return e.arg_count;
    }

    bool WriteStaticInt(Il2CppResolver& resolver, const HookEntry& e) {
      // The runtime offset of a static field is only known when the table carries
      // it. Writing a guessed offset would corrupt whatever sits at that slot,
      // so an unknown offset is skipped instead.
      if (e.field_offset == 0) return false;
      ResolvedField f = resolver.resolveStaticField(e.type_name, e.method_name,
                                                    e.field_offset);
      if (!f.valid()) return false;
      *static_cast<int64_t*>(f.static_address) = e.int_value;
      return true;
    }

    bool WriteStaticString(Il2CppResolver& resolver, const HookEntry& e) {
      if (e.field_offset == 0) return false;
      ResolvedField f = resolver.resolveStaticField(e.type_name, e.method_name,
                                                    e.field_offset);
      if (!f.valid()) return false;
      void* managed = resolver.newManagedString(e.string_value);
      if (!managed) return false;
      *reinterpret_cast<void**>(f.static_address) = managed;
      return true;
    }

    }  // namespace

    // Installs every entry of the table. Returns a short report for the log.
    InstallReport installHooks(const HookTable& table, Il2CppResolver& resolver) {
      InstallReport report;
      for (const HookEntry& e : table.entries()) {
        if (e.action == HookAction::SetStaticInt ||
            e.action == HookAction::SetStaticString) {
          bool ok = (e.action == HookAction::SetStaticInt)
                        ? WriteStaticInt(resolver, e)
                        : WriteStaticString(resolver, e);
          if (ok) {
            report.installed++;
          } else {
            report.skipped++;
            NSLog(@"[TIZAntiCheat] static %s.%s not applied (no runtime offset yet)",
                  e.type_name.c_str(), e.method_name.c_str());
          }
          continue;
        }

        void* detour = DetourFor(e.action);
        if (!detour) {
          report.skipped++;
          continue;
        }

        ResolvedMethod m = resolver.resolveMethod(e.type_name, e.method_name,
                                                  ArgCountFor(e));
        if (!m.valid()) {
          report.failed++;
          NSLog(@"[TIZAntiCheat] unresolved %s.%s", e.type_name.c_str(),
                e.method_name.c_str());
          continue;
        }

        if (m.method_info) {
          // rewrite the method pointer in place
          if (resolver.setMethodPointer(m.method_info, detour)) {
            report.installed++;
            NSLog(@"[TIZAntiCheat] hooked %s.%s (method info %p)", e.type_name.c_str(),
                  e.method_name.c_str(), m.method_info);
          } else {
            report.failed++;
          }
          continue;
        }

        if (MSHookFunction) {
          void* original = nullptr;
          MSHookFunction(m.address, detour, &original);
          report.installed++;
          NSLog(@"[TIZAntiCheat] hooked %s.%s (pattern, %p)", e.type_name.c_str(),
                e.method_name.c_str(), m.address);
          continue;
        }

        report.failed++;
        NSLog(@"[TIZAntiCheat] no way to patch %s.%s (%p)", e.type_name.c_str(),
              e.method_name.c_str(), m.address);
      }
      return report;
    }

    }  // namespace tiz

  source/HookTable.cpp: |
    // HookTable.cpp - JSON reader and hook table loader.
    #include "HookTable.h"

    #include <cctype>
    #include <cstdlib>
    #include <fstream>
    #include <sstream>

    namespace tiz {
    namespace {

    class Parser {
     public:
      Parser(const std::string& text) : s_(text) {}

      bool parse(JsonValue* out, std::string* error) {
        skipSpace();
        if (!parseValue(out, error)) return false;
        skipSpace();
        if (pos_ != s_.size()) {
          *error = "trailing data at offset " + std::to_string(pos_);
          return false;
        }
        return true;
      }

     private:
      void skipSpace() {
        while (pos_ < s_.size()) {
          unsigned char c = static_cast<unsigned char>(s_[pos_]);
          if (c == ' ' || c == '\t' || c == '\n' || c == '\r') {
            ++pos_;
          } else {
            break;
          }
        }
      }

      bool literal(const char* text) {
        size_t n = std::char_traits<char>::length(text);
        if (s_.compare(pos_, n, text) != 0) return false;
        pos_ += n;
        return true;
      }

      bool parseValue(JsonValue* out, std::string* error) {
        skipSpace();
        if (pos_ >= s_.size()) {
          *error = "unexpected end of input";
          return false;
        }
        char c = s_[pos_];
        if (c == '{') return parseObject(out, error);
        if (c == '[') return parseArray(out, error);
        if (c == '"') {
          out->type = JsonValue::Type::kString;
          return parseString(&out->string, error);
        }
        if (literal("true")) {
          out->type = JsonValue::Type::kBool;
          out->boolean = true;
          return true;
        }
        if (literal("false")) {
          out->type = JsonValue::Type::kBool;
          out->boolean = false;
          return true;
        }
        if (literal("null")) {
          out->type = JsonValue::Type::kNull;
          return true;
        }
        // number
        size_t start = pos_;
        if (pos_ < s_.size() && (s_[pos_] == '-' || s_[pos_] == '+')) ++pos_;
        while (pos_ < s_.size() &&
               (std::isdigit(static_cast<unsigned char>(s_[pos_])) || s_[pos_] == '.' ||
                s_[pos_] == 'e' || s_[pos_] == 'E' || s_[pos_] == '-' || s_[pos_] == '+')) {
          ++pos_;
        }
        if (pos_ == start) {
          *error = std::string("unexpected character '") + c + "' at offset " +
                   std::to_string(pos_);
          return false;
        }
        out->type = JsonValue::Type::kNumber;
        out->number = std::strtod(s_.substr(start, pos_ - start).c_str(), nullptr);
        return true;
      }

      bool parseString(std::string* out, std::string* error) {
        if (s_[pos_] != '"') {
          *error = "expected '\"' at offset " + std::to_string(pos_);
          return false;
        }
        ++pos_;
        out->clear();
        while (pos_ < s_.size()) {
          char c = s_[pos_++];
          if (c == '"') return true;
          if (c != '\\') {
            out->push_back(c);
            continue;
          }
          if (pos_ >= s_.size()) break;
          char e = s_[pos_++];
          switch (e) {
            case 'n': out->push_back('\n'); break;
            case 't': out->push_back('\t'); break;
            case 'r': out->push_back('\r'); break;
            case 'b': out->push_back('\b'); break;
            case 'f': out->push_back('\f'); break;
            case '/': out->push_back('/'); break;
            case '"': out->push_back('"'); break;
            case '\\': out->push_back('\\'); break;
            case 'u': {
              if (pos_ + 4 > s_.size()) {
                *error = "truncated \\u escape";
                return false;
              }
              unsigned code = 0;
              for (int i = 0; i < 4; ++i) {
                char h = s_[pos_++];
                code <<= 4;
                if (h >= '0' && h <= '9') code |= static_cast<unsigned>(h - '0');
                else if (h >= 'a' && h <= 'f') code |= static_cast<unsigned>(h - 'a' + 10);
                else if (h >= 'A' && h <= 'F') code |= static_cast<unsigned>(h - 'A' + 10);
              }
              // UTF-8 encode (BMP only, surrogate pairs are passed through)
              if (code < 0x80) {
                out->push_back(static_cast<char>(code));
              } else if (code < 0x800) {
                out->push_back(static_cast<char>(0xC0 | (code >> 6)));
                out->push_back(static_cast<char>(0x80 | (code & 0x3F)));
              } else {
                out->push_back(static_cast<char>(0xE0 | (code >> 12)));
                out->push_back(static_cast<char>(0x80 | ((code >> 6) & 0x3F)));
                out->push_back(static_cast<char>(0x80 | (code & 0x3F)));
              }
              break;
            }
            default:
              out->push_back(e);
              break;
          }
        }
        *error = "unterminated string";
        return false;
      }

      bool parseArray(JsonValue* out, std::string* error) {
        out->type = JsonValue::Type::kArray;
        ++pos_;  // '['
        skipSpace();
        if (pos_ < s_.size() && s_[pos_] == ']') {
          ++pos_;
          return true;
        }
        while (true) {
          JsonValue v;
          if (!parseValue(&v, error)) return false;
          out->array.push_back(v);
          skipSpace();
          if (pos_ >= s_.size()) {
            *error = "unterminated array";
            return false;
          }
          if (s_[pos_] == ',') {
            ++pos_;
            continue;
          }
          if (s_[pos_] == ']') {
            ++pos_;
            return true;
          }
          *error = "expected ',' or ']' at offset " + std::to_string(pos_);
          return false;
        }
      }

      bool parseObject(JsonValue* out, std::string* error) {
        out->type = JsonValue::Type::kObject;
        ++pos_;  // '{'
        skipSpace();
        if (pos_ < s_.size() && s_[pos_] == '}') {
          ++pos_;
          return true;
        }
        while (true) {
          skipSpace();
          std::string key;
          if (!parseString(&key, error)) return false;
          skipSpace();
          if (pos_ >= s_.size() || s_[pos_] != ':') {
            *error = "expected ':' at offset " + std::to_string(pos_);
            return false;
          }
          ++pos_;
          JsonValue v;
          if (!parseValue(&v, error)) return false;
          out->object[key] = v;
          skipSpace();
          if (pos_ >= s_.size()) {
            *error = "unterminated object";
            return false;
          }
          if (s_[pos_] == ',') {
            ++pos_;
            continue;
          }
          if (s_[pos_] == '}') {
            ++pos_;
            return true;
          }
          *error = "expected ',' or '}' at offset " + std::to_string(pos_);
          return false;
        }
      }

      const std::string& s_;
      size_t pos_ = 0;
    };

    }  // namespace

    const JsonValue* JsonValue::find(const std::string& key) const {
      auto it = object.find(key);
      return it == object.end() ? nullptr : &it->second;
    }

    std::string JsonValue::str(const std::string& key, const std::string& fallback) const {
      const JsonValue* v = find(key);
      return (v && v->isString()) ? v->string : fallback;
    }

    double JsonValue::num(const std::string& key, double fallback) const {
      const JsonValue* v = find(key);
      return (v && v->isNumber()) ? v->number : fallback;
    }

    bool JsonValue::booleanValue(const std::string& key, bool fallback) const {
      const JsonValue* v = find(key);
      return (v && v->type == JsonValue::Type::kBool) ? v->boolean : fallback;
    }

    bool parseJson(const std::string& text, JsonValue* out, std::string* error) {
      Parser p(text);
      std::string local;
      if (!p.parse(out, &local)) {
        if (error) *error = local;
        return false;
      }
      return true;
    }

    const char* actionName(HookAction a) {
      switch (a) {
        case HookAction::ReturnFalse: return "return_false";
        case HookAction::ReturnTrue: return "return_true";
        case HookAction::Skip: return "skip";
        case HookAction::SetStaticInt: return "set_static_int";
        case HookAction::SetStaticString: return "set_static_string";
      }
      return "skip";
    }

    bool actionFromName(const std::string& name, HookAction* out) {
      if (name == "return_false") { *out = HookAction::ReturnFalse; return true; }
      if (name == "return_true") { *out = HookAction::ReturnTrue; return true; }
      if (name == "skip") { *out = HookAction::Skip; return true; }
      if (name == "set_static_int") { *out = HookAction::SetStaticInt; return true; }
      if (name == "set_static_string") { *out = HookAction::SetStaticString; return true; }
      return false;
    }

    bool HookTable::loadFromString(const std::string& json, std::string* error) {
      JsonValue root;
      if (!parseJson(json, &root, error)) return false;
      if (!root.isObject()) {
        if (error) *error = "root value is not an object";
        return false;
      }
      if (!parseProfile(root)) {
        if (error) *error = "invalid il2cpp profile";
        return false;
      }
      return parseHooks(root, error);
    }

    bool HookTable::loadFromFile(const std::string& path, std::string* error) {
      std::ifstream in(path, std::ios::binary);
      if (!in) {
        if (error) *error = "cannot open " + path;
        return false;
      }
      std::ostringstream ss;
      ss << in.rdbuf();
      return loadFromString(ss.str(), error);
    }

    bool HookTable::parseProfile(const JsonValue& root) {
      const JsonValue* p = root.find("il2cpp");
      if (!p || !p->isObject()) return true;  // defaults are fine
      const JsonValue* mi = p->find("method_info");
      if (mi && mi->isObject()) {
        profile_.method_info_method_pointer =
            static_cast<uint32_t>(mi->num("method_pointer_offset", profile_.method_info_method_pointer));
        profile_.method_info_name =
            static_cast<uint32_t>(mi->num("name_offset", profile_.method_info_name));
        profile_.method_info_klass =
            static_cast<uint32_t>(mi->num("klass_offset", profile_.method_info_klass));
        profile_.method_info_token =
            static_cast<uint32_t>(mi->num("token_offset", profile_.method_info_token));
      }
      const JsonValue* ci = p->find("class_info");
      if (ci && ci->isObject()) {
        profile_.class_static_fields =
            static_cast<uint32_t>(ci->num("static_fields_offset", profile_.class_static_fields));
        profile_.class_name =
            static_cast<uint32_t>(ci->num("name_offset", profile_.class_name));
        profile_.class_namespace =
            static_cast<uint32_t>(ci->num("namespace_offset", profile_.class_namespace));
      }
      const JsonValue* fi = p->find("field_info");
      if (fi && fi->isObject()) {
        profile_.field_info_offset =
            static_cast<uint32_t>(fi->num("offset_offset", profile_.field_info_offset));
        profile_.field_info_name =
            static_cast<uint32_t>(fi->num("name_offset", profile_.field_info_name));
      }
      return true;
    }

    bool HookTable::parseHooks(const JsonValue& root, std::string* error) {
      const JsonValue* hooks = root.find("hooks");
      if (!hooks || !hooks->isArray()) {
        if (error) *error = "missing \"hooks\" array";
        return false;
      }
      for (size_t i = 0; i < hooks->array.size(); ++i) {
        const JsonValue& h = hooks->array[i];
        if (!h.isObject()) {
          if (error) *error = "hook #" + std::to_string(i) + " is not an object";
          return false;
        }
        HookEntry e;
        e.type_name = h.str("type");
        e.method_name = h.str("method");
        e.note = h.str("note");
        e.token = static_cast<uint32_t>(h.num("token", 0));
        e.arg_count = static_cast<int>(h.num("arg_count", 0));
        e.field_offset = static_cast<uint32_t>(h.num("field_offset", 0));
        std::string action = h.str("action", "skip");
        if (!actionFromName(action, &e.action)) {
          if (error) *error = "unknown action '" + action + "' in hook #" + std::to_string(i);
          return false;
        }
        e.int_value = static_cast<int64_t>(h.num("int_value", 0));
        e.string_value = h.str("string_value");
        if (e.type_name.empty() || e.method_name.empty()) {
          if (error) *error = "hook #" + std::to_string(i) + " lacks type or method";
          return false;
        }
        entries_.push_back(e);
      }
      return true;
    }

    }  // namespace tiz

  source/HookTable.h: |
    // HookTable.h - minimal JSON reader plus the hook table.
    //
    // No third party dependency: the dylib has to stay self contained, so a tiny
    // recursive descent JSON parser lives here. Only the subset the generator
    // emits is supported (objects, arrays, strings, numbers, booleans, null).
    #ifndef TIZ_HOOKTABLE_H
    #define TIZ_HOOKTABLE_H

    #include <map>
    #include <string>
    #include <vector>

    #include "TIZAntiCheat.h"

    namespace tiz {

    class JsonValue {
     public:
      enum class Type { kNull, kBool, kNumber, kString, kArray, kObject };

      Type type = Type::kNull;
      bool boolean = false;
      double number = 0.0;
      std::string string;
      std::vector<JsonValue> array;
      std::map<std::string, JsonValue> object;

      bool isObject() const { return type == Type::kObject; }
      bool isArray() const { return type == Type::kArray; }
      bool isString() const { return type == Type::kString; }
      bool isNumber() const { return type == Type::kNumber; }

      const JsonValue* find(const std::string& key) const;
      std::string str(const std::string& key, const std::string& fallback = "") const;
      double num(const std::string& key, double fallback = 0.0) const;
      bool booleanValue(const std::string& key, bool fallback = false) const;
    };

    // Parses `text`. On failure returns false and fills `error`.
    bool parseJson(const std::string& text, JsonValue* out, std::string* error);

    class HookTable {
     public:
      // Loads the generated hook document. `error` receives a human readable
      // reason when the document is rejected.
      bool loadFromString(const std::string& json, std::string* error);
      bool loadFromFile(const std::string& path, std::string* error);

      const std::vector<HookEntry>& entries() const { return entries_; }
      const Il2CppProfile& profile() const { return profile_; }

     private:
      bool parseHooks(const JsonValue& root, std::string* error);
      bool parseProfile(const JsonValue& root);

      std::vector<HookEntry> entries_;
      Il2CppProfile profile_;
    };

    }  // namespace tiz

    #endif  // TIZ_HOOKTABLE_H

  source/Il2CppResolver.cpp: |
    // Il2CppResolver.cpp
    #include "Il2CppResolver.h"

    #include <cstring>

    #if defined(__APPLE__)
    #include <dlfcn.h>
    #include <mach-o/loader.h>
    #endif

    namespace tiz {
    namespace {

    uint32_t readU32(const void* base, uint32_t offset) {
      uint32_t v = 0;
      std::memcpy(&v, reinterpret_cast<const uint8_t*>(base) + offset, sizeof(v));
      return v;
    }

    uint64_t readU64(const void* base, uint32_t offset) {
      uint64_t v = 0;
      std::memcpy(&v, reinterpret_cast<const uint8_t*>(base) + offset, sizeof(v));
      return v;
    }

    const char* readCStr(const void* base, uint32_t offset) {
      return reinterpret_cast<const char*>(reinterpret_cast<const uint8_t*>(base) + offset);
    }

    }  // namespace

    void Il2CppResolver::setGameImage(void* base, size_t size, const std::string& name) {
      game_base_ = base;
      game_size_ = size;
      game_image_name_ = name;
    }

    bool Il2CppResolver::bindExportedApi(void* image_base) {
    #if defined(__APPLE__)
      if (!image_base) return false;
      class_from_name_ = reinterpret_cast<FnClassFromName>(
          dlsym(image_base, "il2cpp_class_from_name"));
      class_get_method_from_name_ = reinterpret_cast<FnClassGetMethodFromName>(
          dlsym(image_base, "il2cpp_class_get_method_from_name"));
      class_get_field_from_name_ = reinterpret_cast<FnClassGetFieldFromName>(
          dlsym(image_base, "il2cpp_class_get_field_from_name"));
      return class_from_name_ != nullptr && class_get_method_from_name_ != nullptr;
    #else
      (void)image_base;
      return false;
    #endif
    }

    bool Il2CppResolver::bindStringApi(void* image_base) {
    #if defined(__APPLE__)
      if (!image_base) return false;
      string_new_ = reinterpret_cast<FnStringNew>(dlsym(image_base, "il2cpp_string_new"));
      return string_new_ != nullptr;
    #else
      (void)image_base;
      return false;
    #endif
    }

    void* Il2CppResolver::newManagedString(const std::string& utf8) const {
      if (!string_new_) return nullptr;
      return string_new_(utf8.c_str());
    }

    void Il2CppResolver::addPattern(const std::string& type_name,
                                     const std::string& method_name,
                                     const std::string& pattern_hex) {
      patterns_.push_back({type_name, method_name, pattern_hex});
    }

    void* Il2CppResolver::scanPattern(const std::string& pattern_hex) const {
      if (!game_base_ || pattern_hex.empty()) return nullptr;
      // "AA BB ?? CC" -> bytes with 0x00 as the wildcard
      std::vector<uint8_t> bytes;
      std::vector<bool> mask;
      size_t i = 0;
      while (i < pattern_hex.size()) {
        while (i < pattern_hex.size() && pattern_hex[i] == ' ') ++i;
        if (i + 1 >= pattern_hex.size()) break;
        std::string tok = pattern_hex.substr(i, 2);
        i += 2;
        while (i < pattern_hex.size() && pattern_hex[i] == ' ') ++i;
        if (tok == "??") {
          bytes.push_back(0);
          mask.push_back(false);
        } else {
          bytes.push_back(static_cast<uint8_t>(std::strtoul(tok.c_str(), nullptr, 16)));
          mask.push_back(true);
        }
      }
      if (bytes.empty()) return nullptr;
      const uint8_t* base = reinterpret_cast<const uint8_t*>(game_base_);
      size_t limit = game_size_ > bytes.size() ? game_size_ - bytes.size() : 0;
      for (size_t off = 0; off < limit; ++off) {
        size_t k = 0;
        for (; k < bytes.size(); ++k) {
          if (mask[k] && base[off + k] != bytes[k]) break;
        }
        if (k == bytes.size()) return const_cast<uint8_t*>(base) + off;
      }
      return nullptr;
    }

    ResolvedMethod Il2CppResolver::resolveMethod(const std::string& type_name,
                                                 const std::string& method_name,
                                                 int arg_count) {
      ResolvedMethod out;
      out.arg_count = arg_count;

      // strategy 1: exported il2cpp API
      if (class_from_name_ && class_get_method_from_name_) {
        std::string ns;
        std::string cls = type_name;
        size_t dot = type_name.find('.');
        if (dot != std::string::npos) {
          ns = type_name.substr(0, dot);
          cls = type_name.substr(dot + 1);
        }
        void* klass = class_from_name_("Assembly-CSharp", ns.c_str(), cls.c_str());
        if (!klass) klass = class_from_name_(nullptr, ns.c_str(), cls.c_str());
        if (klass) {
          void* info = class_get_method_from_name_(klass, method_name.c_str(), arg_count);
          if (info) {
            out.method_info = info;
            out.address = reinterpret_cast<void*>(readU64(info, profile_.method_info_method_pointer));
            out.name = readCStr(info, profile_.method_info_name);
            if (out.address) return out;
          }
        }
      }

      // strategy 2: pattern table
      for (const auto& p : patterns_) {
        if (p.type_name != type_name || p.method_name != method_name) continue;
        void* addr = scanPattern(p.pattern_hex);
        if (addr) {
          out.address = addr;
          out.name = method_name.c_str();
          return out;
        }
      }

      last_error_ = "could not resolve " + type_name + "::" + method_name;
      return out;
    }

    ResolvedField Il2CppResolver::resolveStaticField(const std::string& type_name,
                                                     const std::string& field_name,
                                                     uint32_t field_offset) {
      ResolvedField out;
      if (!class_from_name_ || !class_get_field_from_name_) return out;
      std::string ns;
      std::string cls = type_name;
      size_t dot = type_name.find('.');
      if (dot != std::string::npos) {
        ns = type_name.substr(0, dot);
        cls = type_name.substr(dot + 1);
      }
      void* klass = class_from_name_("Assembly-CSharp", ns.c_str(), cls.c_str());
      if (!klass) klass = class_from_name_(nullptr, ns.c_str(), cls.c_str());
      if (!klass) return out;
      void* field = class_get_field_from_name_(klass, field_name.c_str());
      if (!field) return out;
      void* static_fields = reinterpret_cast<void*>(
          readU64(klass, profile_.class_static_fields));
      if (!static_fields) return out;
      uint32_t real_offset = field_offset;
      if (real_offset == 0) {
        real_offset = readU32(field, profile_.field_info_offset);
      }
      out.static_address = static_cast<uint8_t*>(static_fields) + real_offset;
      return out;
    }

    bool Il2CppResolver::setMethodPointer(void* method_info, void* detour) {
      if (!method_info || !detour) return false;
      void** slot = reinterpret_cast<void**>(
          static_cast<uint8_t*>(method_info) + profile_.method_info_method_pointer);
      *slot = detour;
      return true;
    }

    }  // namespace tiz

  source/Il2CppResolver.h: |
    // Il2CppResolver.h - turn a managed class/method name into a native pointer.
    //
    // Three strategies, tried in order:
    //   1. the il2cpp_* API exported by the game image
    //   2. a byte pattern table (produced by tools/gen_patterns.py from the game
    //      binary) scanned inside the game image
    //   3. the Il2CppCodeRegistration method pointer table, when the registration
    //      structure can be located
    #ifndef TIZ_IL2CPPRESOLVER_H
    #define TIZ_IL2CPPRESOLVER_H

    #include <cstdint>
    #include <string>
    #include <vector>

    #include "TIZAntiCheat.h"

    namespace tiz {

    struct ResolvedMethod {
      void* address = nullptr;    // native implementation
      void* method_info = nullptr;  // Il2CppMethodInfo*, when known
      const char* name = nullptr;
      int arg_count = 0;
      bool valid() const { return address != nullptr; }
    };

    struct ResolvedField {
      void* static_address = nullptr;  // address of the static storage
      bool valid() const { return static_address != nullptr; }
    };

    class Il2CppResolver {
     public:
      explicit Il2CppResolver(const Il2CppProfile& profile) : profile_(profile) {}

      // Points the resolver at the game image (UnityFramework / libil2cpp.so).
      void setGameImage(void* base, size_t size, const std::string& name);

      // Strategy 1: exported il2cpp API.
      bool bindExportedApi(void* image_base);

      // Optional extra API: needed to build managed strings for static string
      // fields. Returns false when the game does not export it.
      bool bindStringApi(void* image_base);

      // Strategy 2: pattern table.
      void addPattern(const std::string& type_name, const std::string& method_name,
                      const std::string& pattern_hex);

      // Looks a managed method up.
      ResolvedMethod resolveMethod(const std::string& type_name,
                                    const std::string& method_name, int arg_count);

      // Looks a static field up (returns the address of its storage).
      ResolvedField resolveStaticField(const std::string& type_name,
                                       const std::string& field_name,
                                       uint32_t field_offset);

      // Overwrites Il2CppMethodInfo::methodPointer so every call to the managed
      // method lands in `detour`. This is the preferred hooking mechanism: it
      // needs no Substrate and it cannot corrupt the target function.
      bool setMethodPointer(void* method_info, void* detour);

      // Creates a managed string (Il2CppString*) for static string fields.
      void* newManagedString(const std::string& utf8) const;

      const std::string& gameImageName() const { return game_image_name_; }
      bool hasExportedApi() const { return class_from_name_ != nullptr; }
      std::string lastError() const { return last_error_; }

     private:
      void* scanPattern(const std::string& pattern_hex) const;

      Il2CppProfile profile_;
      void* game_base_ = nullptr;
      size_t game_size_ = 0;
      std::string game_image_name_;
      std::string last_error_;

      using FnClassFromName = void* (*)(const char*, const char*, const char*);
      using FnClassGetMethodFromName = void* (*)(void*, const char*, int);
      using FnClassGetFieldFromName = void* (*)(void*, const char*);

      FnClassFromName class_from_name_ = nullptr;
      FnClassGetMethodFromName class_get_method_from_name_ = nullptr;
      FnClassGetFieldFromName class_get_field_from_name_ = nullptr;
      using FnStringNew = void* (*)(const char*);
      FnStringNew string_new_ = nullptr;

      struct PatternEntry {
        std::string type_name;
        std::string method_name;
        std::string pattern_hex;
      };
      std::vector<PatternEntry> patterns_;
    };

    }  // namespace tiz

    #endif  // TIZ_IL2CPPRESOLVER_H

  source/TIZAntiCheat.h: |
    // TIZAntiCheat.h - shared types for the anti-cheat neutralisation layer.
    //
    // The hook table is data driven: it is generated from the IL2CPP metadata and
    // embedded in the dylib, so the same binary keeps working when the game
    // renumbers tokens but keeps the managed names.
    #ifndef TIZ_ANTICHEAT_H
    #define TIZ_ANTICHEAT_H

    #include <cstdint>
    #include <string>
    #include <vector>

    namespace tiz {

    enum class HookAction {
      ReturnFalse,       // detour returns false (w0 = 0) whatever the original did
      ReturnTrue,        // detour returns true  (w0 = 1)
      Skip,              // detour does nothing and returns immediately
      SetStaticInt,      // write an integer into a static field of the class
      SetStaticString,   // write a string into a static field of the class
    };

    const char* actionName(HookAction a);
    bool actionFromName(const std::string& name, HookAction* out);

    struct HookEntry {
      std::string type_name;      // managed class, e.g. "COW.GameFacade"
      std::string method_name;    // managed method, e.g. "IsEmulator"
      uint32_t token = 0;         // IL2CPP method/field token, 0 when unknown
      int arg_count = 0;           // argument count, 0 when unknown
      uint32_t field_offset = 0;   // runtime offset of a static field, 0 = unknown
      HookAction action = HookAction::Skip;
      int64_t int_value = 0;      // value for SetStaticInt
      std::string string_value;   // value for SetStaticString
      std::string note;           // free text, copied from the generator
    };

    // Outcome of one installation round.
    struct InstallReport {
      int installed = 0;
      int skipped = 0;
      int failed = 0;
    };

    // Profile of the IL2CPP runtime layout. Defaults match Unity 2019-2021;
    // the values are overridable from build.yml / the embedded JSON.
    struct Il2CppProfile {
      uint32_t method_info_method_pointer = 0x0;
      uint32_t method_info_name = 0x10;
      uint32_t method_info_klass = 0x18;
      uint32_t method_info_token = 0x30;
      uint32_t class_static_fields = 0xb8;
      uint32_t class_name = 0x10;
      uint32_t class_namespace = 0x18;
      uint32_t field_info_offset = 0x0;
      uint32_t field_info_name = 0x8;
    };

    }  // namespace tiz

    #endif  // TIZ_ANTICHEAT_H

